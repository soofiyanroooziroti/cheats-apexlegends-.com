# Static Astro site — do not auto-add @astrojs/cloudflare (keeps output in dist/).
name = "cheats-apexlegends--com"
# CI workerd may lag behind "today"; stay one day behind max supported in build env.
compatibility_date = "2026-11-08"

# Runs before `wrangler deploy` (including Cloudflare's default `npx wrangler deploy`).
[build]
command = "PUBLIC_SITE_URL=https://cheatsapexlegends.com PUBLIC_HTML_ORIGIN=https://cheats-apexlegends--com.soofiyanroooziroti.workers.dev npm run build:i18n-test"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
